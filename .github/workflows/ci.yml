name: Production Binary Formatting & Distribution Engine
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-convert-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Go Build Matrix
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compile and Optimize Static Executable Binary
        run: |
          go mod tidy
          env GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o output.bin main.go

      - name: Convert Binary Target Stream to Hexadecimal Encoding
        run: |
          xxd -p -c 0 output.bin > output.hex

      - name: Dynamic Multi-Base Obfuscated Asset Generation
        run: |
          python3 -c '
          import os
          
          with open("output.bin", "rb") as f:
              data = f.read()
          val = int.from_bytes(data, byteorder="big")
          
          # Base-12 Transformation Stream
          def to_base12(n):
              if n == 0: return "0"
              chars = "0123456789AB"
              res = []
              while n > 0:
                  res.append(chars[n % 12])
                  n //= 12
              return "".join(reversed(res))
          
          with open("output.twelve", "w") as out:
              out.write(to_base12(val))
              
          # Base-7 Transformation with Symbolic Obfuscation Alpha Set Mapping
          def to_symbolic_base7(n):
              if n == 0: return "a"
              # Character substitution map: 0->a, 1->b, 2->g, 3->d, 4->e, 5->z, 6->h
              # Corresponding to alpha, beta, gamma, delta, epsilon, zeta, eta
              chars = "abgdezh"
              res = []
              while n > 0:
                  res.append(chars[n % 7])
                  n //= 7
              return "".join(reversed(res))
              
          with open("output.seven", "w") as out:
              out.write(to_symbolic_base7(val))
          '

      - name: Run Go Binary to Generate Dynamic Statistical Reports
        run: |
          ./output.bin

      - name: Deploy Encoded Artifacts to Release Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          git checkout -B release
          git add -f output.hex output.twelve output.seven findings.md CI_Outlier_Report.pdf
          
          git diff-index --quiet HEAD || git commit -m "chore: deploy dynamic alpha-obfuscated base-7 build data [skip ci]"
          git push origin release --force
